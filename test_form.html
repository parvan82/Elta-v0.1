<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست فرم پروژه</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <h1>تست فرم پروژه</h1>
    
    <form id="test-form">
        <div class="form-group">
            <label>عنوان پروژه:</label>
            <input type="text" name="title" value="پروژه تست" required>
        </div>
        
        <div class="form-group">
            <label>توضیحات:</label>
            <textarea name="description">این یک پروژه تست است</textarea>
        </div>
        
        <div class="form-group">
            <label>سرویس:</label>
            <select name="service">
                <option value="web-development">توسعه وب</option>
                <option value="mobile-development">توسعه موبایل</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>اولویت:</label>
            <select name="priority">
                <option value="quality">کیفیت بالا</option>
                <option value="speed">سرعت تحویل</option>
                <option value="budget">بودجه کم</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>بودجه:</label>
            <select name="budget">
                <option value="low">زیر 1 میلیون تومان</option>
                <option value="medium">1 تا 5 میلیون تومان</option>
                <option value="high">5 تا 10 میلیون تومان</option>
            </select>
        </div>
        
        <button type="submit">ارسال فرم</button>
    </form>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('_token', 'test-token');
            formData.append('title', document.querySelector('input[name="title"]').value);
            formData.append('description', document.querySelector('textarea[name="description"]').value);
            formData.append('service', document.querySelector('select[name="service"]').value);
            formData.append('priority', document.querySelector('select[name="priority"]').value);
            formData.append('budget', document.querySelector('select[name="budget"]').value);
            
            // مهارت‌های نمونه
            const skills = [
                { skill: 'PHP', level: 'متوسط' },
                { skill: 'Laravel', level: 'متوسط' }
            ];
            formData.append('selected_skills', JSON.stringify(skills));
            
            // سرویس‌های نمونه
            const services = ['create-project', 'urgent'];
            formData.append('selected_services', JSON.stringify(services));
            formData.append('elta_services', JSON.stringify(services));
            
            console.log('داده‌های فرم:');
            for (let [key, value] of formData.entries()) {
                console.log(key + ': ' + value);
            }
            
            // ارسال درخواست
            fetch('/home/new-project', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRF-TOKEN': 'test-token'
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('پاسخ سرور:', data);
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = '<h3>نتیجه:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(error => {
                console.error('خطا:', error);
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = '<h3>خطا:</h3><p>' + error.message + '</p>';
            });
        });
    </script>
</body>
</html>
